<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Van Karte – Familien-Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase Legacy SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- Leaflet Geocoder -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <style>
    body { margin:0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#f7f5f0; color:#333; }
    #map { height: 100vh; width: 100vw; background: #e5e2db; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Control Panel UI */
    #controls {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: #faf7f2; box-shadow: 0 -3px 15px rgba(0,0,0,0.15);
      border-radius: 16px 16px 0 0;
      transition: transform 0.3s ease-in-out;
      transform: translateY(0);
    }
    #controls.collapsed {
      transform: translateY(calc(100% - 30px));
    }
    #toggle-bar {
      height: 30px; background: #dda15e; border-radius: 16px 16px 0 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: white; font-size: 12px; font-weight: bold;
    }
    #toggle-bar:hover { background: #bc6c25; }
    
    .controls-content { padding: 10px 15px 15px 15px; max-height: 50vh; overflow-y: auto; }
    .section-title { color: #bc6c25; font-size: 13px; font-weight: bold; margin-bottom: 6px; display: inline-block; }
    .filter-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    label.filter-lbl { white-space: nowrap; display: inline-flex; align-items: center; background: #fff; padding: 5px 10px; border-radius: 12px; border: 1px solid #ddd; font-size: 12px; cursor: pointer; }
    label.filter-lbl input { margin-right: 5px; }

    .action-btn { background: #2a9d8f; color: white; border: none; padding: 10px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; width: 100%; margin-top: 6px; }
    .action-btn:hover { background: #218377; }
    .secondary-btn { background: #e76f51; }
    .secondary-btn:hover { background: #d45d3f; }

    /* Popup Styling */
    .leaflet-popup-content-wrapper { border-radius: 18px !important; padding: 12px !important; background: #faf7f2 !important; box-shadow: 0 4px 20px rgba(0,0,0,0.15) !important; }
    .leaflet-popup-content { margin: 8px !important; line-height: 1.4 !important; }
    
    .popup-route-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background-color: #dda15e; color: white !important; text-decoration: none;
      padding: 8px 12px; border-radius: 10px; font-weight: bold; font-size: 13px; margin-top: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.12); transition: background-color 0.2s ease;
    }
    .popup-route-btn:hover { background-color: #bc6c25; }

    /* Modal Dialog */
    .modal {
      display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6); align-items: center; justify-content: center;
    }
    .modal-content {
      background-color: #fff; padding: 20px; border-radius: 16px; width: 85%; max-width: 380px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4); max-height: 85vh; overflow-y: auto; position: relative;
    }
    .modal-content h3 { margin-top: 0; color: #bc6c25; }
    .modal-content label { display: block; font-size: 12px; font-weight: bold; margin-top: 8px; color: #555; }
    .modal-content input[type="text"], .modal-content textarea, .modal-content select {
      width: 100%; padding: 8px; margin: 4px 0 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 13px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="controls">
  <div id="toggle-bar" onclick="toggleControls()">▼ Filter & Aktionen klappen</div>
  <div class="controls-content">
    <div class="section-title">Kategorien filtern</div>
    <div class="filter-container">
      <label class="filter-lbl"><input type="checkbox" value="Stellplatz" checked onchange="filterMarkers()"> 🚐 Stellplatz</label>
      <label class="filter-lbl"><input type="checkbox" value="Ausflug" checked onchange="filterMarkers()"> 🎡 Ausflug</label>
      <label class="filter-lbl"><input type="checkbox" value="Essen" checked onchange="filterMarkers()"> 🍕 Essen</label>
      <label class="filter-lbl"><input type="checkbox" value="Einkaufen" checked onchange="filterMarkers()"> 🛒 Einkaufen</label>
      <label class="filter-lbl"><input type="checkbox" value="Sonstiges" checked onchange="filterMarkers()"> 📍 Sonstiges</label>
    </div>
    <button class="action-btn" onclick="openAddModal()">➕ Neuen Ort hinzufügen</button>
  </div>
</div>

<!-- Modal Dialog -->
<div id="placeModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Ort hinzufügen</h3>
    <input type="hidden" id="editKey" value="">
    
    <label>Name des Orts:</label>
    <input type="text" id="placeTitle" placeholder="z.B. Bergheider See">
    
    <label>Kategorie:</label>
    <select id="placeCategory">
      <option value="Stellplatz">🚐 Stellplatz</option>
      <option value="Ausflug">🎡 Ausflug</option>
      <option value="Essen">🍕 Essen</option>
      <option value="Einkaufen">🛒 Einkaufen</option>
      <option value="Sonstiges">📍 Sonstiges</option>
    </select>

    <label>Breitengrad (Lat):</label>
    <input type="text" id="placeLat" placeholder="51.5833">
    
    <label>Längengrad (Lng):</label>
    <input type="text" id="placeLng" placeholder="13.7833">

    <label>Ausstattung:</label>
    <div style="font-size: 12px; margin: 4px 0 8px 0; display:flex; gap:15px;">
      <label style="font-weight:normal;"><input type="checkbox" id="hasElectricity"> ⚡ Strom</label>
      <label style="font-weight:normal;"><input type="checkbox" id="hasWater"> 💧 Wasser</label>
    </div>

    <label>Beschreibung / Notizen:</label>
    <textarea id="placeDesc" rows="3" placeholder="Notizen zum Ort..."></textarea>

    <label>Bild-URL (optional):</label>
    <input type="text" id="placeImg" placeholder="https://...">

    <button class="action-btn" onclick="savePlace()">Speichern</button>
    <button class="action-btn secondary-btn" onclick="closeModal()">Abbrechen</button>
  </div>
</div>

<script>
// --- FIREBASE INITIALISIERUNG ---
const firebaseConfig = {
  apiKey: "AIzaSyC08G4qAOB3I9p7rHyT_IaA9phN1SlmKcw",
  authDomain: "van-karte.firebaseapp.com",
  databaseURL: "https://van-karte-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "van-karte",
  storageBucket: "van-karte.firebasestorage.app",
  messagingSenderId: "17815837597",
  appId: "1:17815837597:web:d2d345e1c822b0ee0dad74"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

// --- KARTE INITIALISIEREN ---
const map = L.map('map').setView([51.5833, 13.7833], 8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Geocoder Suchleiste oben rechts
L.Control.geocoder({ defaultMarkGeocode: false })
  .on('markgeocode', function(e) {
    const bbox = e.geocode.bbox;
    const poly = L.polygon([
      bbox.getSouthEast(),
      bbox.getNorthEast(),
      bbox.getNorthWest(),
      bbox.getSouthWest()
    ]);
    map.fitBounds(poly.getBounds());
  })
  .addTo(map);

let allPlaces = {};
let activeMarkers = [];

const categoryIcons = {
  'Stellplatz': '🚐',
  'Ausflug': '🎡',
  'Essen': '🍕',
  'Einkaufen': '🛒',
  'Sonstiges': '📍'
};

function buildPopupHtml(key, item) {
  const icon = categoryIcons[item.category] || '📍';
  
  let ausstattungHtml = '';
  if (item.category === 'Stellplatz') {
    const strom = item.hasElectricity ? '✅ Strom' : '❌ kein Strom';
    const wasser = item.hasWater ? '✅ Wasser' : '❌ kein Wasser';
    ausstattungHtml = `<p style="color:#bc6c25; font-weight:bold; font-size:12px; margin: 4px 0 8px 0;">Ausstattung: ${strom} | ${wasser}</p>`;
  }

  let descHtml = '';
  if (item.description) {
    descHtml = `
      <div style="background:#f0ebe1; padding:8px 10px; border-left:3px solid #bc6c25; border-radius:6px; font-size:12px; margin-bottom:8px;">
        📝 ${item.description}
      </div>`;
  }

  let imgHtml = '';
  if (item.imageUrl) {
    imgHtml = `<img src="${item.imageUrl}" style="width:100%; max-height:180px; object-fit:cover; border-radius:10px; margin-bottom:8px;" />`;
  }

  const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}`;

  return `
    <div style="min-width: 200px; font-family: sans-serif;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <h3 style="margin:0; font-size:16px; color:#bc6c25;">${item.title || item.name || 'Unbenannter Ort'}</h3>
        <div>
          <span style="cursor:pointer; font-size:14px; margin-right:4px;" onclick="editPlace('${key}')" title="Bearbeiten">✏️</span>
          <span style="cursor:pointer; font-size:14px;" onclick="deletePlace('${key}')" title="Löschen">🗑️</span>
        </div>
      </div>
      <div style="font-size:12px; color:#666; margin-bottom:6px;">${icon} ${item.category || 'Sonstiges'}</div>
      
      ${ausstattungHtml}
      ${descHtml}
      ${imgHtml}

      <a href="${mapsUrl}" target="_blank" class="popup-route-btn">
        🧭 Route von meinem Standort
      </a>
    </div>
  `;
}

// Daten laden - greift jetzt direkt auf 'markers' zu!
db.ref('markers').on('value', (snapshot) => {
  allPlaces = snapshot.val() || {};
  renderMarkers();
});

function renderMarkers() {
  activeMarkers.forEach(m => map.removeLayer(m));
  activeMarkers = [];

  const checkedCategories = Array.from(document.querySelectorAll('.filter-container input:checked')).map(cb => cb.value);

  Object.keys(allPlaces).forEach(key => {
    const item = allPlaces[key];
    const category = item.category || 'Sonstiges';

    if (checkedCategories.includes(category)) {
      const iconText = categoryIcons[category] || '📍';
      const customIcon = L.divIcon({
        html: `<div style="font-size: 22px;">${iconText}</div>`,
        className: 'custom-div-icon',
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      if (item.lat && item.lng) {
        const marker = L.marker([parseFloat(item.lat), parseFloat(item.lng)], { icon: customIcon }).addTo(map);
        marker.bindPopup(buildPopupHtml(key, item));
        activeMarkers.push(marker);
      }
    }
  });
}

function filterMarkers() {
  renderMarkers();
}

function toggleControls() {
  document.getElementById('controls').classList.toggle('collapsed');
}

// Modals Steuerung
function openAddModal() {
  document.getElementById('modalTitle').innerText = 'Ort hinzufügen';
  document.getElementById('editKey').value = '';
  document.getElementById('placeTitle').value = '';
  document.getElementById('placeCategory').value = 'Stellplatz';
  document.getElementById('placeLat').value = '';
  document.getElementById('placeLng').value = '';
  document.getElementById('hasElectricity').checked = false;
  document.getElementById('hasWater').checked = false;
  document.getElementById('placeDesc').value = '';
  document.getElementById('placeImg').value = '';
  
  document.getElementById('placeModal').style.display = 'flex';
}

function editPlace(key) {
  const item = allPlaces[key];
  if (!item) return;

  const password = prompt("Bitte Passwort zum Bearbeiten eingeben:");
  if (password !== "1234") {
    alert("Falsches Passwort!");
    return;
  }

  document.getElementById('modalTitle').innerText = 'Ort bearbeiten';
  document.getElementById('editKey').value = key;
  document.getElementById('placeTitle').value = item.title || item.name || '';
  document.getElementById('placeCategory').value = item.category || 'Stellplatz';
  document.getElementById('placeLat').value = item.lat;
  document.getElementById('placeLng').value = item.lng;
  document.getElementById('hasElectricity').checked = !!item.hasElectricity;
  document.getElementById('hasWater').checked = !!item.hasWater;
  document.getElementById('placeDesc').value = item.description || '';
  document.getElementById('placeImg').value = item.imageUrl || '';
  
  document.getElementById('placeModal').style.display = 'flex';
}

function deletePlace(key) {
  const password = prompt("Bitte Passwort zum Löschen eingeben:");
  if (password === "1234") {
    db.ref('markers/' + key).remove();
  } else {
    alert("Falsches Passwort!");
  }
}

function savePlace() {
  const key = document.getElementById('editKey').value;
  const data = {
    title: document.getElementById('placeTitle').value,
    category: document.getElementById('placeCategory').value,
    lat: parseFloat(document.getElementById('placeLat').value),
    lng: parseFloat(document.getElementById('placeLng').value),
    hasElectricity: document.getElementById('hasElectricity').checked,
    hasWater: document.getElementById('hasWater').checked,
    description: document.getElementById('placeDesc').value,
    imageUrl: document.getElementById('placeImg').value
  };

  if (isNaN(data.lat) || isNaN(data.lng)) {
    alert("Bitte gültige Koordinaten für Breitengrad und Längengrad eingeben!");
    return;
  }

  if (key) {
    db.ref('markers/' + key).update(data);
  } else {
    db.ref('markers').push(data);
  }

  closeModal();
}

function closeModal() {
  document.getElementById('placeModal').style.display = 'none';
}
</script>
</body>
</html>
