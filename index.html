<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Van Karte</title>
  
  <!-- Leaflet & Geocoder CSS/JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <!-- Firebase Legacy SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    
    /* Menü-Steuerung */
    #controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      max-width: 300px;
      transition: all 0.3s ease;
    }
    #controls.collapsed #controls-content { display: none; }
    #toggle-bar { cursor: pointer; font-weight: bold; color: #bc6c25; text-align: center; }
    
    /* Pop-up Styles */
    .popup-content { font-size: 13px; color: #333; }
    .popup-header-box { display: flex; justify-content: space-between; align-items: center; }
    .popup-title-area { display: flex; align-items: center; gap: 8px; }
    .popup-icon { font-size: 20px; }
    .popup-info { font-size: 11px; color: #666; }
    .popup-notes { margin-top: 6px; font-style: italic; background: #f4f1de; padding: 6px; border-radius: 6px; }
    .popup-actions { display: flex; gap: 4px; }
    .popup-action-btn { background: none; border: none; cursor: pointer; font-size: 14px; }
    .link-btn {
      display: inline-block;
      padding: 4px 8px;
      background-color: #bc6c25;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 11px;
    }

    /* Modal für die Bild-Vergrößerung */
    .image-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .image-modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    
    /* Routenliste & Eingaben */
    .route-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; font-size: 12px; }
    #routeList { max-height: 120px; overflow-y: auto; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- Overlay-Fenster für vergrößerte Fotos -->
  <div id="imageModal" class="image-modal" onclick="this.style.display='none'">
    <img id="modalImage" src="" alt="Vergrößertes Foto">
  </div>

  <div id="map"></div>

  <div id="controls">
    <div id="toggle-bar" onclick="toggleControls()">🌾 Menü ausblenden 🔽</div>
    <div id="controls-content">
      <hr style="border:0; border-top:1px solid #eee; margin: 8px 0;">
      
      <input type="text" id="searchBox" placeholder="🔍 Ort suchen..." onkeyup="renderRouteList()" style="width:95%; padding:4px; margin-bottom:6px;">
      
      <div id="routeList"></div>
      
      <button onclick="calculateRoute()" style="width:100%; margin-top:6px; background:#bc6c25; color:white; border:none; padding:6px; border-radius:6px; cursor:pointer;">🗺️ Route berechnen</button>
      
      <hr style="border:0; border-top:1px solid #eee; margin: 8px 0;">
      
      <label style="font-size:11px; color:#555;">📷 Foto für neuen Ort wählen:</label>
      <input type="file" id="photoInput" accept="image/*" style="width:100%; font-size:11px; margin-top:2px;">
      
      <div style="margin-top:10px; display:flex; gap:4px;">
        <button onclick="downloadBackup()" style="font-size:10px; width:50%;">💾 Sicherung</button>
        <button onclick="document.getElementById('uploadInput').click()" style="font-size:10px; width:50%;">📂 Wiederherstellen</button>
        <input type="file" id="uploadInput" style="display:none;" onchange="uploadBackup(this)">
      </div>
    </div>
  </div>

<script>
const orsApiKey = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6Ijk3YTlkMmYwYTRiYTQ3MjdiNzQyZjMyODNlMDk2N2I2IiwiaCI6Im11cm11cjY0In0=";
const firebaseConfig = {
  apiKey: "AIzaSyC08G4qAOB3I9p7rHyT_IaA9phN1SlmKcw",
  authDomain: "van-karte.firebaseapp.com",
  databaseURL: "https://van-karte-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "van-karte",
  storageBucket: "van-karte.firebasestorage.app",
  messagingSenderId: "17815837597",
  appId: "1:17815837597:web:d2d345e1c822b0ee0dad74"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

var map = L.map('map').setView([54, 15], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors'}).addTo(map);

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(function(position) {
    var lat = position.coords.latitude;
    var lng = position.coords.longitude;
    L.circleMarker([lat, lng], {
        radius: 9, fillColor: '#3388ff', color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.8
    }).addTo(map).bindPopup("📍 Hier bist du gerade");
    map.setView([lat, lng], 9);
  }, function(err) { console.log("GPS nicht verfügbar"); });
}

L.Control.geocoder({
  defaultMarkGeocode: false,
  placeholder: "🔍 Ort suchen...",
  errorMessage: "Ort nicht gefunden."
})
.on('markgeocode', function(e) {
  var bbox = e.geocode.bbox;
  var poly = L.polygon([bbox.getSouthEast(), bbox.getNorthEast(), bbox.getNorthWest(), bbox.getSouthWest()]);
  map.fitBounds(poly.getBounds());
  L.popup().setLatLng(e.geocode.center).setContent("📌 " + e.geocode.name).openOn(map);
})
.addTo(map);

var markersArray = [];
var categoryLayers = {
  stellplatz: L.layerGroup().addTo(map),
  camping: L.layerGroup().addTo(map),
  wasser: L.layerGroup().addTo(map),
  genuss: L.layerGroup().addTo(map),
  shoppen: L.layerGroup().addTo(map),
  wasserwunder: L.layerGroup().addTo(map),
  abenteuer: L.layerGroup().addTo(map),
  kultur: L.layerGroup().addTo(map),
  natur: L.layerGroup().addTo(map),
  tiere: L.layerGroup().addTo(map)
};
var routeLayer = L.layerGroup().addTo(map);

function createEmojiIcon(emoji){
  return L.divIcon({
    html:`<div style="font-size:24px; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.15));">${emoji}</div>`,
    className:'',
    iconSize:[30,30],
    iconAnchor:[15,30]
  });
}

var icons = {
  stellplatz: createEmojiIcon("🚐"),
  camping: createEmojiIcon("⛺"),
  wasser: createEmojiIcon("💧"),
  genuss: createEmojiIcon("☕"),
  shoppen: createEmojiIcon("👜"),
  wasserwunder: createEmojiIcon("🌊"),
  abenteuer: createEmojiIcon("🚶"),
  kultur: createEmojiIcon("🏰"),
  natur: createEmojiIcon("🌲"),
  tiere: createEmojiIcon("🐾")
};

var popupInfos = {
  stellplatz: '🚐 Stellplatz',
  camping: '⛺ Campingplatz',
  wasser: '💧 Frischwasser',
  genuss: '☕ Essen',
  shoppen: '👜 Bummeln',
  wasserwunder: '🌊 Wasser',
  abenteuer: '🚶 Aktivität & Abenteuer',
  kultur: '🏰 Kultur & Sehenswürdigkeit',
  natur: '🌲 Naturgebiet',
  tiere: '🐾 Tiere beobachten'
};

function toggleControls() {
    var panel = document.getElementById('controls');
    var bar = document.getElementById('toggle-bar');
    if (panel.classList.contains('collapsed')) {
        panel.classList.remove('collapsed');
        bar.innerHTML = "🌾 Menü ausblenden 🔽";
    } else {
        panel.classList.add('collapsed');
        bar.innerHTML = "🌾 Menü einblenden 🔼";
    }
}

function openPhotoModal(src) {
  document.getElementById('modalImage').src = src;
  document.getElementById('imageModal').style.display = 'flex';
}

function resizeImage(file, maxWidth, callback) {
  var reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onload = function(event) {
    var img = new Image();
    img.src = event.target.result;
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var width = img.width; 
      var height = img.height;
      if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
      canvas.width = width; canvas.height = height;
      var ctx = canvas.getContext('2d'); 
      ctx.drawImage(img, 0, 0, width, height);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.7); 
      callback(dataUrl);
    };
  };
}

function saveMarkerToFirebase(latlng, category, text, name, ownInfo, webLink, photoData, hasStrom, hasWasser, hasWC, isFavorite, isKids) {
  if (webLink && !webLink.startsWith('http://') && !webLink.startsWith('https://')) { webLink = 'https://' + webLink; }
  const newMarkerRef = database.ref('markers').push();
  newMarkerRef.set({
    lat: latlng.lat, lng: latlng.lng, category: category, text: text, name: name,
    ownInfo: ownInfo || "", webLink: webLink || "", photo: photoData || "",
    hasStrom: hasStrom || false, hasWasser: hasWasser || false, hasWC: hasWC || false,
    isFavorite: isFavorite || false, isKids: isKids || false,
    selected: true, timestamp: firebase.database.ServerValue.TIMESTAMP
  });
  document.getElementById("photoInput").value = "";
}

map.on('click', function(e){
  var mainType = prompt("1 = Stellplatz 🚐\n2 = Campingplatz ⛺\n3 = Frischwasser 💧\n4 = Essen ☕\n5 = Bummeln 👜\n6 = Sehenswürdigkeit / Aktivität");
  if(!mainType) return;
  var name = prompt("Name des Ortes:");
  if(!name) return;
  var ownInfo = prompt("Notizen / Kurze Info zu diesem Ort:");
  var webLink = prompt("Webseite/Link (optional):","");
  
  var favFrage = prompt("Ist das ein Favorit/Sternchen? (ja / nein)", "nein");
  var kidsFrage = prompt("Ist der Ort kinderfreundlich? (ja / nein)", "nein");
  
  var isFavorite = (favFrage && favFrage.toLowerCase().trim() === "ja");
  var isKids = (kidsFrage && kidsFrage.toLowerCase().trim() === "ja");

  var category="", text="", emoji="", hasStrom=false, hasWasser=false, hasWC=false;

  if(mainType==1 || mainType==2){
    category = (mainType==1) ? "stellplatz" : "camping";
    emoji = (mainType==1) ? "🚐" : "⛺";
    var stromFrage = prompt("Gibt es Strom? (ja / nein)", "nein");
    var wasserFrage = prompt("Gibt es Wasser am Platz? (ja / nein)", "nein");
    var wcFrage = prompt("Gibt es Toiletten? (ja / nein)", "nein");
    if(stromFrage && stromFrage.toLowerCase().trim() === "ja") { hasStrom = true; }
    if(wasserFrage && wasserFrage.toLowerCase().trim() === "ja") { hasWasser = true; }
    if(wcFrage && wcFrage.toLowerCase().trim() === "ja") { hasWC = true; }
  } else if(mainType==3){ category="wasser"; emoji="💧"; }
  else if(mainType==4){ category="genuss"; emoji="☕"; }
  else if(mainType==5){ category="shoppen"; emoji="👜"; }
  else if(mainType==6){
    var subType=prompt("1=Kultur 🏰\n2=Natur 🌲\n3=Wasser 🌊\n4=Abenteuer & Action 🚶\n5=Tiere 🐾");
    if(subType==1){category="kultur"; emoji="🏰";}
    else if(subType==2){category="natur"; emoji="🌲";}
    else if(subType==3){category="wasserwunder"; emoji="🌊";}
    else if(subType==4){category="abenteuer"; emoji="🚶";}
    else if(subType==5){category="tiere"; emoji="🐾";}
    else return;
  } else return;

  var ausstattungZusatz = "";
  if(isFavorite) ausstattungZusatz += "⭐";
  if(isKids) ausstattungZusatz += "👶";
  if(hasStrom) ausstattungZusatz += "⚡";
  if(hasWasser) ausstattungZusatz += "💧";
  if(hasWC) ausstattungZusatz += "🚽";
  
  text = emoji + " " + name + (ausstattungZusatz ? " " + ausstattungZusatz : "");

  var fileInput = document.getElementById("photoInput");
  if(fileInput.files.length > 0){
    resizeImage(fileInput.files[0], 600, function(resizedPhotoData) {
      saveMarkerToFirebase(e.latlng, category, text, name, ownInfo, webLink, resizedPhotoData, hasStrom, hasWasser, hasWC, isFavorite, isKids);
    });
  } else {
    saveMarkerToFirebase(e.latlng, category, text, name, ownInfo, webLink, "", hasStrom, hasWasser, hasWC, isFavorite, isKids);
  }
});

database.ref('markers').on('value', function(snapshot) {
  markersArray.forEach(m => { if(m.leafletMarker) map.removeLayer(m.leafletMarker); });
  markersArray = [];
  const data = snapshot.val();
  if (data) {
    Object.keys(data).forEach(key => {
      var item = data[key]; 
      item.key = key;
      
      var ausstattungText = "";
      if(item.category === "stellplatz" || item.category === "camping") {
        ausstattungText = `<div class="popup-info" style="margin-top:4px; font-weight:bold; color:#bc6c25;">` +
        `Ausstattung: ${item.hasStrom ? '⚡ Strom' : '❌ Strom'} | ${item.hasWasser ? '💧 Wasser' : '❌ Wasser'} | ${item.hasWC ? '🚽 WC' : '❌ WC'}` +
        `</div>`;
      }

      var highlightText = "";
      if(item.isFavorite || item.isKids) {
        highlightText = `<div class="popup-info" style="margin-top:4px; font-weight:bold; color:#dda15e;">` +
        `${item.isFavorite ? '⭐ Favorit ' : ''}${item.isKids ? '👶 Kinderfreundlich' : ''}` +
        `</div>`;
      }

      var googleMapsUrl = `https://www.google.com/maps?q=${item.lat},${item.lng}`;

      var marker = L.marker([item.lat, item.lng], {icon: icons[item.category]}).bindPopup(`<div class="popup-content">
        <div class="popup-header-box">
          <div class="popup-title-area">
            <div class="popup-icon">${item.text.split(" ")[0]}</div>
            <div>
              <strong style="color:#bc6c25; font-size:14px;">${item.name || item.text.substring(item.text.indexOf(" ")+1)}</strong>
              <div class="popup-info">${popupInfos[item.category]}</div>
            </div>
          </div>
          <div class="popup-actions">
            <button class="popup-action-btn" onclick="editMarker('${item.key}')" title="Bearbeiten">✏️</button>
            <button class="popup-action-btn" onclick="deleteMarker('${item.key}')" title="Löschen">🗑️</button>
          </div>
        </div>${highlightText}${ausstattungText}${item.ownInfo ? `<div class="popup-notes">📝 ${item.ownInfo}</div>` : ""}
        <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;">
          <a href="${googleMapsUrl}" target="_blank" class="link-btn" style="background-color: #4285F4;">📍 Google Maps</a>
          ${item.webLink ? `<a href="${item.webLink}" target="_blank" class="link-btn">🌐 Link öffnen</a>` : ""}
        </div>
        ${item.photo ? `<img src="${item.photo}" onclick="openPhotoModal('${item.photo}')" style="width:100%; max-height:140px; object-fit:cover; border-radius:10px; margin-top:8px; border: 1px solid #e6dfd3; cursor:pointer;" title="Klicken zum Vergrößern">` : ""}
      </div>`
      ).addTo(categoryLayers[item.category]);

      marker.on('contextmenu', function() {
        editMarker(item.key);
      });

      item.leafletMarker = marker; 
      markersArray.push(item);
    });
  }
  renderRouteList();
});

function toggleCategory(cat){ 
  map.hasLayer(categoryLayers[cat]) ? map.removeLayer(categoryLayers[cat]) : map.addLayer(categoryLayers[cat]); 
}

function calculateRoute(){
  var selectedMarkers = markersArray.filter(m=>m.selected);
  if(selectedMarkers.length<2){alert("Bitte mindestens 2 ausgewählte Marker!"); return;}
  var coords = selectedMarkers.map(m=>[m.lng,m.lat]);
  fetch('https://api.openrouteservice.org/v2/directions/driving-car/geojson',{
    method:'POST', 
    headers:{'Authorization':orsApiKey,'Content-Type':'application/json'}, 
    body:JSON.stringify({coordinates:coords})
  }).then(r=>r.json()).then(data=>{
    routeLayer.clearLayers(); 
    L.geoJSON(data,{style:{color:'#bc6c25',weight:5,opacity:0.85}}).addTo(routeLayer);
  }).catch(err=>{console.error(err); alert("Fehler bei Route!");});
}

function renderRouteList(){
  const routeDiv = document.getElementById('routeList'); 
  routeDiv.innerHTML = '';
  const searchVal = document.getElementById('searchBox').value.toLowerCase().trim();

  markersArray.forEach((m,i)=>{
    const matchesSearch = !searchVal || 
                          m.text.toLowerCase().includes(searchVal) || 
                          (m.ownInfo && m.ownInfo.toLowerCase().includes(searchVal));
    if (!matchesSearch) return;
    const div = document.createElement('div'); 
    div.className = 'route-item';
    div.innerHTML = `
    <input type="checkbox" ${m.selected?"checked":""} onchange="toggleSelected(${i},this)" style="accent-color: #bc6c25;">
    <span style="font-weight: 500; color: #4a3f35;">${m.text}</span>
    <span>
      <button onclick="editMarker('${m.key}')" title="Bearbeiten">✏️</button>
      <button onclick="deleteMarker('${m.key}')" title="Löschen">🗑️</button>
    </span>`;
    routeDiv.appendChild(div);
  });
}

function toggleSelected(i,cb){ markersArray[i].selected = cb.checked; }

function editMarker(key) {
  var markerData = markersArray.find(m => m.key === key); 
  if (!markerData) return;
  map.closePopup();
  
  var catPrompt = prompt("Kategorie ändern? Leer lassen für unverändert:\n1 = Stellplatz 🚐\n2 = Campingplatz ⛺\n3 = Frischwasser 💧\n4 = Essen ☕\n5 = Bummeln 👜\n6 = Kultur 🏰\n7 = Natur 🌲\n8 = Wasser 🌊\n9 = Abenteuer 🚶\n10 = Tiere 🐾", "");
  if (catPrompt === null) return;
  var currentCategory = markerData.category; 
  var emoji = markerData.text ? markerData.text.split(" ")[0] : "📌";

  if(catPrompt.trim() !== "") {
    var choice = parseInt(catPrompt.trim());
    if(choice==1){ currentCategory="stellplatz"; emoji="🚐"; }
    else if(choice==2){ currentCategory="camping"; emoji="⛺"; }
    else if(choice==3){ currentCategory="wasser"; emoji="💧"; }
    else if(choice==4){ currentCategory="genuss"; emoji="☕"; }
    else if(choice==5){ currentCategory="shoppen"; emoji="👜"; }
    else if(choice==6){ currentCategory="kultur"; emoji="🏰"; }
    else if(choice==7){ currentCategory="natur"; emoji="🌲"; }
    else if(choice==8){ currentCategory="wasserwunder"; emoji="🌊"; }
    else if(choice==9){ currentCategory="abenteuer"; emoji="🚶"; }
    else if(choice==10){ currentCategory="tiere"; emoji="🐾"; }
  }

  var defaultName = markerData.name || (markerData.text ? markerData.text.substring(markerData.text.indexOf(" ")+1) : "");
  var newName = prompt("Name anpassen:", defaultName); 
  if (newName === null) return;
  
  var newInfo = prompt("Notizen anpassen:", markerData.ownInfo || ""); 
  if (newInfo === null) return;
  
  var newLink = prompt("Link anpassen:", markerData.webLink || ""); 
  if (newLink === null) return;
  if (newLink && !newLink.startsWith('http://') && !newLink.startsWith('https://')) { newLink = 'https://' + newLink; }

  var currentFav = markerData.isFavorite || false;
  var currentKids = markerData.isKids || false;
  
  var favFrage = prompt("Ist das ein Favorit/Sternchen? (ja / nein)", currentFav ? "ja" : "nein");
  var kidsFrage = prompt("Ist der Ort kinderfreundlich? (ja / nein)", currentKids ? "ja" : "nein");
  
  currentFav = (favFrage && favFrage.toLowerCase().trim() === "ja");
  currentKids = (kidsFrage && kidsFrage.toLowerCase().trim() === "ja");

  var currentStrom = markerData.hasStrom || false; 
  var currentWasser = markerData.hasWasser || false;
  var currentWC = markerData.hasWC || false;

  if(currentCategory === "stellplatz" || currentCategory === "camping") {
    var stromFrage = prompt("Gibt es Strom? (ja / nein)", currentStrom ? "ja" : "nein");
    var wasserFrage = prompt("Gibt es Wasser am Platz? (ja / nein)", currentWasser ? "ja" : "nein");
    var wcFrage = prompt("Gibt es Toiletten? (ja / nein)", currentWC ? "ja" : "nein");
    currentStrom = (stromFrage && stromFrage.toLowerCase().trim() === "ja");
    currentWasser = (wasserFrage && wasserFrage.toLowerCase().trim() === "ja");
    currentWC = (wcFrage && wcFrage.toLowerCase().trim() === "ja");
  } else { 
    currentStrom = false; 
    currentWasser = false; 
    currentWC = false; 
  }

  var ausstattungZusatz = ""; 
  if(currentFav) ausstattungZusatz += "⭐";
  if(currentKids) ausstattungZusatz += "👶";
  if(currentStrom) ausstattungZusatz += "⚡"; 
  if(currentWasser) ausstattungZusatz += "💧";
  if(currentWC) ausstattungZusatz += "🚽";

  var fullText = emoji + " " + newName + (ausstattungZusatz ? " " + ausstattungZusatz : "");

  var changePhoto = confirm("Möchtest du das FOTO für diesen Ort ändern oder ein neues hinzufügen?");
  if(changePhoto) {
      alert("Bitte wähle jetzt im Menü unten unter 'Foto für neuen Ort' dein neues Bild aus.");
      var panel = document.getElementById('controls');
      if (panel.classList.contains('collapsed')) { toggleControls(); }
      var fileInput = document.getElementById("photoInput");
      fileInput.onchange = function() {
          if(fileInput.files.length > 0) {
              resizeImage(fileInput.files[0], 600, function(resizedPhotoData) {
                  database.ref('markers/' + key).update({ 
                      category: currentCategory, name: newName, text: fullText, 
                      ownInfo: newInfo, webLink: newLink, hasStrom: currentStrom, 
                      hasWasser: currentWasser, hasWC: currentWC,
                      isFavorite: currentFav, isKids: currentKids, photo: resizedPhotoData 
                  });
                  document.getElementById("photoInput").value = "";
                  fileInput.onchange = null;
              });
          }
      };
  } else {
      database.ref('markers/' + key).update({ 
          category: currentCategory, name: newName, text: fullText, 
          ownInfo: newInfo, webLink: newLink, hasStrom: currentStrom, 
          hasWasser: currentWasser, hasWC: currentWC,
          isFavorite: currentFav, isKids: currentKids
      });
  }
}

function deleteMarker(key){ 
  map.closePopup();
  if(confirm("Möchtest du diesen Ort wirklich löschen?")) { 
      database.ref('markers/' + key).remove(); 
  } 
}

function downloadBackup() {
  database.ref('markers').once('value').then(snapshot => {
      const data = snapshot.val();
      if (!data) { alert("Keine Daten zum Sichern vorhanden!"); return; }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "vankarte_sicherung_" + new Date().toISOString().slice(0,10) + ".json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
  });
}

function uploadBackup(input) {
  if (input.files.length === 0) return;
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = function(e) {
      try {
          const importedData = JSON.parse(e.target.result);
          if (confirm("Möchtest du die Sicherung jetzt einspielen? Fehlende Orte werden in Firebase wiederhergestellt.")) {
              Object.keys(importedData).forEach(key => {
                  database.ref('markers/' + key).set(importedData[key]);
              });
              alert("Sicherung erfolgreich geladen!");
              input.value = "";
          }
      } catch (err) {
          alert("Fehler beim Lesen der Datei. Ist es eine gültige Sicherungsdatei?");
      }
  };
  reader.readAsText(file);
}
</script>
